name: Release

# Two ways to release; the version always comes from the newest CHANGELOG.md section.
# - Run this workflow by hand on the default branch: it tags the checked-out commit
#   with that version and publishes the release.
# - Push a tag yourself: the tag must match that version.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 scripts/package_release.py --print-version "$REF_NAME" >/dev/null
            tag="$REF_NAME"
          else
            tag=$(python3 scripts/package_release.py --print-version)
            if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
              set -- $ref
              sha=$2
              [ "$1" = tag ] && sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)
              if [ "$sha" != "$GITHUB_SHA" ]; then
                echo "::error::tag $tag already exists on $sha, not on $GITHUB_SHA; add a new version section to CHANGELOG.md"
                exit 1
              fi
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"
            exit 1
          fi
          echo "Release tag: $tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: |
          node scripts/prepare_ci_lock.cjs
          npm ci --ignore-scripts
      - name: Build release archive and notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: python3 scripts/package_release.py "$RELEASE_TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # --target creates the tag on this commit when it does not exist yet.
          if [ "$EVENT" = push ]; then
            tag_opt=--verify-tag
          else
            tag_opt="--target=$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" build/LabelPlus_PS-Script_*.7z "$tag_opt" \
            --title "v${RELEASE_TAG#v}" --notes-file build/release-notes.md
